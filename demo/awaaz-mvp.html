<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awaaz MVP · Johar Town demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8;--surface:#FFFFFF;--surface-2:#F5F7FB;--ink:#121D33;--muted:#5A6472;--line:#D8DFEA;
  --navy:#121D33;--on-navy:#E9EEF6;--accent:#D98E04;--accent-ink:#7A4F00;--accent-soft:#FBEBCB;
  --chat:#E3E9F2;--me:#FCEBC8;--bot:#FFFFFF;--ok:#2F7D4F;--ok-soft:#DDF0E4;--warn:#B3261E;--warn-soft:#F9DEDC;
  --c-roads:#9A6324;--c-sanitation:#7A5AA6;--c-water:#1F7FB8;--c-electrical:#C28E00;--c-gas:#D1495B;--c-encroachment:#4F7A4F;--c-other:#6B7280;
  --block:#E4EAF3;--road:#FFFFFF;
  --serif:"Literata",Cambria,Georgia,serif;--sans:"Noto Sans",Calibri,"Segoe UI",Arial,sans-serif;--urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1322;--surface:#131E34;--surface-2:#18243D;--ink:#E9EEF6;--muted:#9AA6BA;--line:#27344F;
  --navy:#0E1729;--accent:#E9A21F;--accent-ink:#F6C35A;--accent-soft:#3A2B0A;
  --chat:#0F1A2E;--me:#3A2B0A;--bot:#18243D;--ok:#5CC08A;--ok-soft:#133224;--warn:#F2877F;--warn-soft:#3B1715;
  --block:#1A2742;--road:#0B1322;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1322;--surface:#131E34;--surface-2:#18243D;--ink:#E9EEF6;--muted:#9AA6BA;--line:#27344F;
  --navy:#0E1729;--accent:#E9A21F;--accent-ink:#F6C35A;--accent-soft:#3A2B0A;
  --chat:#0F1A2E;--me:#3A2B0A;--bot:#18243D;--ok:#5CC08A;--ok-soft:#133224;--warn:#F2877F;--warn-soft:#3B1715;
  --block:#1A2742;--road:#0B1322;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.2}
.ur{font-family:var(--urdu);direction:rtl;text-align:right;line-height:2.1}
.muted{color:var(--muted)}
.wrap{display:flex;flex-direction:column;height:100%}

/* Top bar */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--navy);color:var(--on-navy)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:24px;letter-spacing:.02em;color:#fff}
.brand span{font-size:13px;color:#AAB5C8}
.clock{display:flex;align-items:center;gap:8px;font-size:13px}
.clock b{font-family:var(--serif);font-size:15px;color:#fff;min-width:150px}
.tbtn{border:1px solid #33425F;background:#1B2A4A;color:#fff;border-radius:8px;padding:6px 11px;font-size:13px}
.tbtn:hover{background:#243659}
.tbtn.amber{background:var(--accent);border-color:var(--accent);color:#1b1200;font-weight:600}
.seg{display:inline-flex;border:1px solid #33425F;border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:#C5CEDD;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:#E9EEF6;color:#121D33;font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* Layout */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,410px) 1fr;gap:20px;padding:20px}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:12px;gap:12px}.phone{height:74vh}}

/* Phone */
.phone{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--chat);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.phead b{display:block;font-size:15px}
.phead small{color:var(--muted);font-size:12px}
.chat{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:8px 11px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:2px 8px;text-align:center}
.msg .who{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{border:1px solid var(--accent);background:transparent;color:var(--accent-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.acts button.primary{background:var(--accent);color:#1b1200}
.acts button:disabled{opacity:.5;cursor:default}
.voice{display:flex;align-items:center;gap:8px}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:3px;border-radius:2px;background:var(--accent-ink);opacity:.75}
.transcript{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
.typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px;white-space:normal}
.card .ref{font-family:var(--serif);font-size:18px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:6px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
details.doc summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-ink);margin-top:6px}
details.doc pre{white-space:pre-wrap;font:12.5px/1.5 var(--sans);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 0;max-height:260px;overflow:auto}
.compose{background:var(--surface);border-top:1px solid var(--line);padding:8px 10px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:12.5px}
.chip:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.locsel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.locsel select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.input{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;min-width:0}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center;flex:none}

/* Console */
.console{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.panel{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 28px}
.panel h2{font-size:22px}
.lede{color:var(--muted);margin:4px 0 18px;max-width:70ch}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1200;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.badge.esc{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge.urgent{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* Tracker */
.thead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;justify-content:space-between}
.thead .ref{font-family:var(--serif);font-size:28px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0 8px;position:relative}
.step{position:relative;text-align:center;font-size:13px;color:var(--muted);padding-top:30px}
.step::before{content:"";position:absolute;top:9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:1}
.step::after{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::after{display:none}
.step.done{color:var(--ink);font-weight:600}.step.done::before{background:var(--ok);border-color:var(--ok)}.step.done::after{background:var(--ok)}
.step.now::before{border-color:var(--accent);background:var(--accent-soft)}
.ladder{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.rung{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.rung b{display:block;font-size:14px}
.rung.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.rung.on b{color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--surface-2);border-radius:10px;padding:12px}
.fact b{display:block;font-family:var(--serif);font-size:24px}
.fact span{font-size:12.5px;color:var(--muted)}
.fact.late b{color:var(--warn)}
.sim{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 18px}
.sim h3{font-size:15px;margin-bottom:8px}
.sim .row{flex-wrap:wrap}
.timeline{list-style:none;margin:10px 0 0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 16px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.hi::before{border-color:var(--accent);background:var(--accent)}
.timeline time{display:block;font-size:12px;color:var(--muted)}
h3.sec{font-size:17px;margin:22px 0 6px}

/* Queue */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--navy);color:var(--on-navy);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--serif);font-size:30px;color:var(--accent)}
.kpi span{font-size:12.5px}
.queue{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.qrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.qrow:hover{border-color:var(--accent)}
.qrow .rank{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.qrow.top .rank{color:var(--accent)}
.qrow .t{font-weight:600;font-size:14px}
.qrow .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow .n{text-align:right}
.qrow .n b{display:block;font-family:var(--serif);font-size:22px;line-height:1}
.qrow .n span{font-size:11.5px;color:var(--muted)}
.qrow.flash{animation:flash 2.4s ease-out}
.qrow.flash .n b{animation:pop .6s .5s ease-out both}
@keyframes flash{0%{background:var(--accent-soft);border-color:var(--accent)}70%{background:var(--accent-soft);border-color:var(--accent)}100%{background:var(--surface)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45);color:var(--accent)}100%{transform:scale(1)}}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.low i{background:var(--warn)}

/* Map */
.mapwrap{display:grid;grid-template-columns:1fr 260px;gap:16px}
@media (max-width:1100px){.mapwrap{grid-template-columns:1fr}}
.map{width:100%;height:auto;border-radius:12px;background:var(--road);border:1px solid var(--line)}
.map .blk{fill:var(--block)}
.map .lbl{fill:var(--muted);font:600 15px var(--sans)}
.map .pin{cursor:pointer;stroke:var(--surface);stroke-width:2}
.map .pin:hover,.map .pin.sel{stroke:var(--ink);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.side{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;align-self:start}

/* Report */
.clusters{display:grid;gap:14px}
.cluster{border:1px solid var(--line);border-radius:12px;padding:16px}
.cluster .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.bigstat{font-family:var(--serif);font-size:20px;font-weight:700;max-width:60ch}
.rep{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.rep{grid-template-columns:1fr}}
.rep > div{background:var(--surface-2);border-radius:10px;padding:14px;font-size:14.5px}
.rep .ur{font-size:15.5px}

/* Log */
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.log li{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.log .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.log .h b{font-size:14px}
.log pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-radius:8px;padding:8px;margin:8px 0 0;max-height:280px;overflow:auto}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;max-width:75ch}
.locbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.locbar select{flex:1 1 100%;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.locbar select.need{border-color:var(--accent)}
.lbtn{flex:1 1 0;justify-content:center;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lbtn:hover{border-color:var(--accent)}
.lbtn:disabled{opacity:.55;cursor:progress}
.msg .locmsg{display:flex;align-items:flex-start;gap:6px}
.msg .locmsg svg{flex:none;margin-top:3px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:19px}
.x{border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px;border-radius:8px;color:var(--muted)}
.pick-body{padding:14px 18px;overflow:auto}
.pick-body .lmap{height:min(420px,55vh)}
.pick-body #pickSvg{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--road);cursor:crosshair}
.sheet-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);font-size:13.5px}
.why{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:16px 0 0}
.why p{margin:4px 0 0}
.why .src{font-size:12.5px;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--accent-ink)}
.srcbtn:hover{border-color:var(--accent)}
.kblist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kblist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kblist li.hi{border-color:var(--accent);background:var(--accent-soft)}
.kblist .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.kblist p{margin:6px 0;font-size:14px}
.kblist code{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:900px){html,body,.wrap{height:auto}.app{display:flex;flex-direction:column}.phone{height:78vh;flex:none}.console{min-height:80vh}.panel{overflow:visible}.topbar{padding:10px 12px;gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header class="topbar">

    <button class="tbtn" id="skip1" title="Advance the simulated clock by one day">+1 day</button>
    <button class="tbtn amber" id="skip7" title="Advance the simulated clock by seven days">Skip 7 days</button>
  </div>
  <div class="seg" role="group" aria-label="AI mode">
    <button id="mLive" aria-pressed="false" disabled title="Live AI isn't available in this view">Live AI</button>
    <button id="mScript" aria-pressed="true">Scripted</button>
  </div>
  <button class="tbtn" id="reset">Reset demo</button>
</header>
<main class="app">
  <section class="phone" aria-label="Citizen view">
    <div class="phead">
      <div class="avatar" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D98E04" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
      <div><b>Awaaz</b><small>Citizen view · WhatsApp-style</small></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="compose">
      <div class="chips" id="chips" aria-label="Demo messages"></div>
      <div class="locbar">
        <select id="loc" aria-label="Problem location"></select>
        <button type="button" class="lbtn" id="locCur" title="Share your current location"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Current location</button>
        <button type="button" class="lbtn" id="locMap" title="Pick the spot on a map"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Select on map</button>
      </div>

        <button class="send" id="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1b1200"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
      </form>
    </div>
  </section>
  <section class="console" aria-label="Awaaz console">
    <div class="tabs" role="tablist" id="tabs"></div>

  </section>

const KW = {
  roads: /gadd?ha|gadda|pothole|sadak|sarak|road|speed ?breaker|سڑک|گڑھا|گڈھا/i,
  sanitation: /gutter|sewer|sewage|naali|nali|kachra|koora|kooda|garbage|trash|badbu|smell of sewage|گٹر|کچرا|نالی|سیوریج|گندا پانی/i,
  water: /nalk|tap|supply|pressure|pani nahi|water not|no water|پانی نہیں|نلک/i,
  electrical: /bijli|light|wire|taar|spark|chingari|transformer|pole|current|بجلی|تار|چنگاری/i,
  gas: /\bgas\b|گیس/i,
  encroachment: /thela|stall|qabza|encroach|footpath|تجاوز|قبضہ|ٹھیلا/i
};
function detectLang(s) {
  if (isUrdu(s)) return 'ur';
  if (/\b(hai|hain|ka|ki|ke|mein|nahi|bohat|gaya|raha|se|pe|par)\b/i.test(s)) return 'ur-Latn';
  return 'en';
}
function scriptedClassify(text, loc) {
  const lang = detectLang(text);
  const hits = Object.entries(KW).filter(([, re]) => re.test(text)).map(([c]) => c);
  let cat = hits[0] || 'other';
  if (hits.includes('gas')) cat = 'gas';
  else if (hits.includes('sanitation') && hits.includes('water')) cat = /gutter|sewer|گٹر|گندا/i.test(text) ? 'sanitation' : 'water';
  const vaguePani = /pani|پانی|water/i.test(text) && !hits.length;
  let conf = hits.length ? 0.9 : 0.35;
  let clar = null;
  if (vaguePani) { conf = 0.5; clar = (TXT.clarifyWater[langKey(lang)] || TXT.clarifyWater.en)(); }
  else if (!hits.length) clar = (TXT.clarifyOther[langKey(lang)] || TXT.clarifyOther.en)();

  const body1 = `To: ${a.name}\n\nSubject: Follow-up on unresolved complaint ${i.id}\n\nRespected Sir/Madam,\n\nThis is a follow-up to complaint ${i.id}, filed on ${filed}: ${i.summary}, ${areaOf(i.sector)}. The issue remains unresolved after ${d} days and has been reported by ${i.reports} residents.\n\nWe request that it be addressed and that residents be informed of the expected resolution date.\n\nReference: ${i.id}\nResidents of ${areaOf(i.sector)} (via Awaaz)`;
  if (tier === 1) return { tier, recipients: [a.name], subject: `Follow-up on unresolved complaint ${i.id}`, body: body1, short_post: null, consent_prompt: '' };
  if (tier === 2) return { tier, recipients: [a.name, contactFor(i)], subject: `Second follow-up: complaint ${i.id} unresolved for ${d} days`,
    body: body1.replace('To: ' + a.name, `To: ${a.name}\nCC: ${contactFor(i)}`) + `\n\nWe also request the office of the UC Chairman to follow up with ${a.name} on this matter.`, short_post: null, consent_prompt: '' };
  const short = `${i.summary.split(' outside')[0]} in ${areaOf(i.sector)}: unresolved for ${d} days. Reported by ${i.reports} residents. Ref ${i.id} with ${a.name}.`;
  return { tier, recipients: ['Your own social account'], subject: 'Public post (you post it yourself)', body: `${short}\n\nTimeline:\n` + i.events.map(e => `• ${shortDate(e.day)}: ${e.text}`).join('\n'), short_post: short.slice(0, 280), consent_prompt: '' };
}
function agent4(i, tier) {
  const prompt = `You are Awaaz's Escalator. Write the tier ${tier} escalation for this Issue.
Tier 1: formal re-complaint to the same authority citing the reference id, filing date, days elapsed and number of residents. Firm, respectful, English.
Tier 2: the same letter to the authority, CC'd to the contact given below, with one sentence asking that office to follow up. Do not invent contacts.
Tier 3: a public post the citizen will review and post themselves. short_post max 280 characters; body is a longer version with the timeline. Only facts from the record: issue, sector (not exact address), reference id, days unresolved, number of residents, authority name. No insults, no accusations of intent or corruption, no named individuals.
Never state that anything has been sent or posted. consent_prompt: one line in the citizen's language (${S.lang}) asking them to approve.

ISSUE: ${JSON.stringify({ reference_id: i.id, summary: i.summary, category: i.cat, area: areaOf(i.sector), authority: AUTH[i.auth].name, filed: fmtDate(i.firstDay), days_unresolved: daysOpen(i), residents: i.reports, prior_tier: i.tier, cc_contact: tier === 2 ? contactFor(i) : null })}
TIMELINE: ${JSON.stringify(i.events.map(e => ({ date: fmtDate(e.day), event: e.text })))}

Reply with only JSON: {"tier":${tier},"recipients":["..."],"subject":"...","body":"...","short_post":null,"consent_prompt":"..."}`;
  return runAgent('4 · Tracker & Escalator', prompt, () => scriptedEscalation(i, tier),
    o => o && typeof o.body === 'string' && o.body.length > 40 && (tier !== 3 || typeof o.short_post === 'string'));
}

/* ---------- Agent 5: Pattern Analyst ---------- */
function clusters() {
  const g = {};
  S.issues.filter(i => S.day - i.firstDay <= 30).forEach(i => { const k = i.sector + '|' + i.cat; (g[k] = g[k] || []).push(i); });
  return Object.entries(g).map(([k, list]) => {
    const [sector, cat] = k.split('|'); const open = list.filter(i => i.stage !== 'resolved');
    const reports = list.reduce((s, i) => s + i.reports, 0);
    return { key: k, sector, cat, list, issues: list.length, reports, resolved: list.length - open.length,
      avg: open.length ? Math.round(open.reduce((s, i) => s + daysOpen(i), 0) / open.length) : 0,
      prev: PREV_WINDOW[k] ?? 0, auth: AUTH[list[0].auth].name, top: [...list].sort((a, b) => b.reports - a.reports)[0] };
  }).filter(c => c.issues >= 3 || c.reports >= 10).sort((a, b) => b.reports - a.reports);
}
function scriptedReport(c) {
  const trend = c.prev ? `up from ${c.prev} in the previous 30 days` : 'with no reports in the previous 30 days';
  const noun = CATS[c.cat].noun;
  return {
    h: `${c.reports} residents reported ${c.issues} ${noun} issues in ${areaOf(c.sector)} in 30 days`,
    en: `${c.reports} residents have reported ${c.issues} ${noun} issues in ${areaOf(c.sector)} in the last 30 days, ${trend}. The most reported is "${c.top.summary}" with ${c.top.reports} residents behind it. ${c.resolved} of the ${c.issues} issues have been resolved so far, and open issues have been pending for ${c.avg} days on average. Residents can add their own report on Awaaz to strengthen this record. Authority contact: ${c.auth}.`,
    ur: `جوہر ٹاؤن ${c.sector} میں پچھلے 30 دنوں میں ${c.reports} رہائشیوں نے ${CATS[c.cat].ur} کے ${c.issues} مسائل رپورٹ کیے ہیں، جبکہ اس سے پہلے کے 30 دنوں میں یہ تعداد ${c.prev} تھی۔ ان میں سے ${c.resolved} مسائل اب تک حل ہوئے ہیں، اور زیرِ التوا مسائل اوسطاً ${c.avg} دن سے حل طلب ہیں۔ رہائشی آواز پر اپنی شکایت شامل کر کے اس ریکارڈ کو مضبوط بنا سکتے ہیں۔ متعلقہ ادارہ: ${c.auth}۔`
  };
}
function parseReport(txt) {
  const h = (txt.match(/HEADLINE:\s*(.+)/) || [])[1] || '';
  const en = ((txt.split(/ENGLISH:/)[1] || '').split(/URDU:/)[0] || '').trim();
  const ur = (txt.split(/URDU:/)[1] || '').trim();
  return { h: h.trim(), en, ur };
}
async function agent5(c) {
  S.reports[c.key] = { loading: true, h: '', en: '', ur: '' }; renderConsole();
  const t0 = performance.now();
  if (S.mode === 'live' && SAMPLE) {
    const prompt = `You are Awaaz's Pattern Analyst. Write a Neighborhood Report for residents, the local councilor and journalists.
Rules: lead with the numbers (total resident reports AND distinct issues). State the resolution count and average days open plainly. Report the pattern, not a verdict: no speculation about cause, blame or intent. No names, phone numbers or exact addresses. End with a neutral call to action: residents can add their voice on Awaaz; give the authority's name. 4-6 sentences in each language.

CLUSTER: ${JSON.stringify({ area: areaOf(c.sector), category: c.cat, window_days: 30, distinct_issues: c.issues, resident_reports: c.reports, resolved_issues: c.resolved, avg_days_open_for_open_issues: c.avg, reports_previous_30_days: c.prev, most_reported: { summary: c.top.summary, residents: c.top.reports }, authority: c.auth })}

Reply in exactly this format, plain text:
HEADLINE: <one line for a dashboard card>
ENGLISH:
<report>
URDU:
<report in Urdu script>`;
    try {
      const { text } = await SAMPLE(prompt, { modelTier: 'default', onText: ({ text }) => { S.reports[c.key] = { loading: true, ...parseReport(text) }; if (S.tab === 'report') renderConsole(); } });
      const r = parseReport(text);
      if (r.en) { S.reports[c.key] = { ...r, mode: 'live' }; logAgent('5 · Pattern Analyst', 'live', performance.now() - t0, r); renderConsole(); return; }
      logAgent('5 · Pattern Analyst', 'error', performance.now() - t0, { text }, 'Could not parse report; used scripted fallback.');
    } catch (e) {
      if (e && e.code === 'not_granted') { SAMPLE_DENIED = true; setMode('scripted'); }
      logAgent('5 · Pattern Analyst', 'error', performance.now() - t0, { code: e && e.code, message: e && e.message }, 'Live call failed; used scripted fallback.');
    }
  }
  await sleep(500);
  const r = scriptedReport(c);
  S.reports[c.key] = { ...r, mode: 'scripted' }; logAgent('5 · Pattern Analyst', 'scripted', performance.now() - t0, r); renderConsole();
}

/* ---------- Flows ---------- */
async function citizenSays(text, locKey, voice = false, echo = true) {
  if (S.busy || !text.trim()) return;
  if (echo) push({ from: 'me', text, voice });
  const loc = LOCS[locKey];
  if (!loc) { askForLocation(text, voice); return; }
  S.awaitLoc = null;
  S.busy = true; setComposerBusy(true);
  if (loc.outside) sys('This spot is outside the demo area. The demo only knows Lahore departments, so routing is illustrative.');
  try {
    let full = text;
    let routerAsked = false;
    if (S.pending && S.pending.type === 'clarify') { full = S.pending.text + '. ' + text; routerAsked = !!S.pending.routerAsked; S.pending = null; }
    setTyping('Understanding your message…');
    const c = await agent1(full, loc);
    setTyping(null);
    S.lang = langKey(c.language);
    if (c.needs_clarification || c.confidence < 0.6 || c.authority_id === 'unknown') {
      S.pending = { type: 'clarify', text: full, loc: locKey };
      bot(c.needs_clarification || t('clarifyOther'));
      return;
    }
    setTyping('Checking which department is responsible…');
    const routing = await agentRouter(c, loc, full);
    setTyping(null);
    if (routing.needs_clarification && !routerAsked) {
      S.pending = { type: 'clarify', text: full, loc: locKey, routerAsked: true };
      bot(routing.needs_clarification);
      return;
    }
    if (routing.stop) { bot(routing.explanation + ' Please contact your society office. If it is actually a city area, reply "city area".'); S.pending = { type: 'clarify', text: full, loc: locKey, routerAsked: true }; return; }
    c.authority_id = routing.authority_id;
    if (c.severity === 'urgent') bot(t('urgent', { gas: c.category === 'gas' }));
    setTyping('Checking nearby reports…');
    const m = await agent2(c, loc);
    setTyping(null);
    if (m.decision === 'match') {
      const i = byId(m.issue_id);
      bot(t('match', { n: i.reports, id: i.id, d: daysOpen(i) }), {
        actions: [{ label: t('addVoice'), run: () => addVoice(i) }, { label: t('different'), run: () => fileNew(c, loc, routing) }]
      });
    } else await fileNew(c, loc, routing);
  } finally { S.busy = false; setComposerBusy(false); setTyping(null); }
}
async function addVoice(i) {
  S.mine = i.id; S.view = i.id; i.mine = true;
  S.tab = 'queue'; renderConsole();
  await sleep(reduceMotion() ? 50 : 700);
  const before = rowTops();
  i.reports += 1;
  i.events.push({ day: S.day, text: `You added your voice (resident #${i.reports})`, hi: true });
  S.flash = i.id; renderConsole(); flip(before);
  setTimeout(() => { S.flash = null; }, 2600);
  bot(t('added', { id: i.id, n: i.reports }), { receipt: { id: i.id, auth: AUTH[i.auth].name, cat: CATS[i.cat].label, sev: i.sev, sector: i.sector, n: i.reports, channel: CHANNEL_LABEL[AUTH[i.auth].channel], date: fmtDate(i.firstDay), doc: i.draft ? i.draft.formatted_complaint : null } });
}
async function fileNew(c, loc, routing) {
  S.busy = true; setComposerBusy(true);
  try {
    const id = 'AWZ-LHR-' + String(S.seq++).padStart(5, '0');
    const i = mkIssue(id, c.category, c.severity, c.authority_id, loc.sector, loc.x, loc.y, c.summary_en, 1, 0, S.day);
    i.events = []; i.mine = true; i.routing = routing || null;
    S.issues.push(i); S.mine = id; S.view = id;
    setTyping('Drafting your complaint…');
    const d = await agent3(i, loc);
    setTyping(null);
    i.draft = d;
    i.events.push({ day: S.day, text: `Filed with ${AUTH[i.auth].name} (${CHANNEL_LABEL[AUTH[i.auth].channel].toLowerCase()})`, hi: true });
    if (routing && routing.changed) bot(routing.explanation_local || routing.explanation);
    bot(d.citizen_confirmation, { receipt: { id, auth: AUTH[i.auth].name, cat: CATS[i.cat].label, sev: i.sev, sector: i.sector, n: 1, channel: CHANNEL_LABEL[AUTH[i.auth].channel], date: fmtDate(S.day), doc: d.formatted_complaint } });
    S.tab = 'tracker'; renderConsole();
  } finally { S.busy = false; setComposerBusy(false); setTyping(null); }
}
function sendCheckin(i, reminder = false) {
  if (!reminder) i.checkin = { day: S.day, reminded: false };
  else i.checkin.reminded = true;
  i.events.push({ day: S.day, text: reminder ? 'Reminder sent to citizen' : 'Check-in sent: is it fixed?' });
  bot(t(reminder ? 'reminder' : 'checkin', { id: i.id }), {
    actions: [{ label: t('yes'), run: () => citizenConfirmsFixed(i) }, { label: t('no'), run: () => citizenSaysNo(i) }]
  });
}
function closeOpenPrompts() { S.chat.forEach(m => { if (m.actions && !m.done) m.done = true; }); }
async function citizenSaysNo(i) {
  i.checkin = null;
  i.events.push({ day: S.day, text: 'Citizen reports it is still unresolved' });
  if (i.tier >= 3) { bot(t('finalTier', { id: i.id })); renderConsole(); return; }
  await proposeEscalation(i, i.tier + 1);
}
async function proposeEscalation(i, tier) {
  setTyping(`Drafting Tier ${tier} escalation…`);
  const d = await agent4(i, tier);
  setTyping(null);
  i.pendingEsc = d;
  i.events.push({ day: S.day, text: `Tier ${tier} draft ready, waiting for citizen approval` });
  const titles = { 1: 'Tier 1 · Formal re-complaint', 2: 'Tier 2 · CC to UC Chairman', 3: 'Tier 3 · Public post for you to review' };
  bot(d.consent_prompt || '', {
    draft: { title: titles[tier], recipients: (d.recipients || []).join(', '), body: d.body, short: tier === 3 ? d.short_post : null },
    actions: [{ label: tier === 3 ? t('copyPost') : t('approve'), run: () => approveEscalation(i) }, { label: t('notNow'), run: () => declineEscalation(i) }]
  });

}
async function approveEscalation(i) {
  const d = i.pendingEsc; if (!d) return;
  i.pendingEsc = null; i.tier = d.tier; i.expectedDay = S.day + 7; i.checkin = null;
  if (d.tier === 3) {
    const ok = await copyText(d.short_post || d.body);
    i.events.push({ day: S.day, text: 'Tier 3 post handed to citizen to post themselves', hi: true });
    bot(ok ? t('copied', { id: i.id }) : t('copied', { id: i.id }) + ' (Copy was blocked here, so select the text above.)');
  } else {
    i.events.push({ day: S.day, text: d.tier === 1 ? `Tier 1 re-complaint sent to ${AUTH[i.auth].name}` : `Tier 2 sent, CC ${contactFor(i)}`, hi: true });

  }

}
function declineEscalation(i) {
  i.events.push({ day: S.day, text: `Citizen declined Tier ${i.pendingEsc ? i.pendingEsc.tier : ''} for now` });
  i.pendingEsc = null; bot(t('declined')); renderConsole();
}
async function citizenConfirmsFixed(i) {
  i.checkin = null;
  bot(t('waitVerify'));
  i.events.push({ day: S.day, text: 'Citizen says it is fixed; asking a neighbor to confirm' });
  renderConsole();
  await sleep(1600);
  resolveIssue(i, true);
}
function resolveIssue(i, notify) {
  i.stage = 'resolved'; i.resolvedDay = S.day; i.pendingEsc = null; i.checkin = null;
  i.events.push({ day: S.day, text: `Resident R-${i.id.slice(-5)}-02 confirmed the fix with an after photo. Resolved in ${daysOpen(i)} days.`, hi: true });
  S.history[i.auth].push(daysOpen(i));
  logAgent('2 · Matcher & Verifier', 'rule', 0, { issue_id: i.id, resolution_verified: true, resolution_proof: 'after photo (simulated)', days: daysOpen(i) });
  if (notify) bot(t('resolved', { id: i.id, d: daysOpen(i) }));
  renderConsole();
}
function authorityAction(i, act) {
  const a = AUTH[i.auth].name;
  if (act === 'ack') { i.stage = 'acknowledged'; i.events.push({ day: S.day, text: `Acknowledged by ${a}` }); }
  if (act === 'progress') { i.stage = 'in_progress'; i.events.push({ day: S.day, text: `${a} marked work in progress` }); }
  if (act === 'fixed') {
    i.events.push({ day: S.day, text: `${a} marked it fixed; waiting for resident confirmation` });
    if (i.mine) {
      closeOpenPrompts(); i.pendingEsc = null; i.checkin = null;
      bot(t('authFixed', { auth: a, id: i.id }), { actions: [{ label: t('yes'), run: () => citizenConfirmsFixed(i) }, { label: t('no'), run: () => { i.stage = 'in_progress'; i.events.push({ day: S.day, text: 'Resident says it is not fixed; reopened', hi: true }); bot(t('stillThere', { id: i.id, auth: a })); renderConsole(); } }] });
    } else setTimeout(() => resolveIssue(i, false), 900);
  }
  renderConsole();
}
function advance(n) {
  sys(`${n === 1 ? '1 day' : n + ' days'} later · ${fmtDate(S.day + n)}`);
  for (let k = 0; k < n; k++) {
    S.day += 1;
    const i = byId(S.mine);
    if (!i || i.stage === 'resolved' || i.pendingEsc) continue;
    if (!i.checkin && S.day >= i.expectedDay) { closeOpenPrompts(); sendCheckin(i); }
    else if (i.checkin && !i.checkin.reminded && S.day - i.checkin.day >= 3) sendCheckin(i, true);
  }
  renderClock(); renderConsole(); renderChat();
}

async function reverseGeocode(lat, lng) {
  // Free OpenStreetMap Nominatim lookup. Blocked on the hosted claude.ai page; works when the file is run locally or deployed.
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=17&accept-language=en`, { signal: ctl.signal, headers: { Accept: 'application/json' } });
    const j = await r.json(); const a = j.address || {};
    return [a.road, a.neighbourhood || a.suburb || a.quarter, a.city || a.town || a.village].filter(Boolean).join(', ') || null;
  } catch (e) { return null; } finally { clearTimeout(tm); }
}
async function setGeoLocation(key, lat, lng, kind, accuracy) {
  const p = fromLL(lat, lng);
  const inArea = Math.hypot(p.x - 485, p.y - 300) * M_PER_UNIT <= 2500;
  const coords = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  const place = await reverseGeocode(lat, lng);
  const sector = inArea ? sectorOf(p.x, p.y) : (place || `near ${coords}`);
  const label = `${kind}: ${place || (inArea ? 'near ' + sectorOf(p.x, p.y) : coords)}${accuracy ? ` (±${Math.round(accuracy)} m)` : ''}`;
  LOCS[key] = { label, sector, x: p.x, y: p.y, lat, lng, outside: !inArea, kind: key };
  renderLocOptions(key); drawPins();
  push({ from: 'me', loc: true, text: `${place || coords}${inArea ? ` · ${areaOf(sector)}` : ''}` });
  resumeIfWaiting();
}
function useCurrentLocation() {
  if (!('geolocation' in navigator)) { toast("This browser can't share location. Select on the map instead."); openPicker(); return; }
  const b = $('#locCur'); b.disabled = true; const old = b.lastChild.textContent; b.lastChild.textContent = 'Finding you…';
  const done = () => { b.disabled = false; b.lastChild.textContent = old; };
  navigator.geolocation.getCurrentPosition(async pos => {
    await setGeoLocation('current', pos.coords.latitude, pos.coords.longitude, 'Current location', pos.coords.accuracy); done();
  }, err => {
    done();
    toast(err.code === 1 ? 'Location permission is off for this page. Select on the map instead.' : "Couldn't get your location. Select on the map instead.");
    openPicker();

}

$('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) sendDemo(Number(c.dataset.k)); });
function renderLocOptions(sel) {
  const cur = sel !== undefined ? sel : $('#loc').value;
  const mine = ['current', 'picked'].filter(k => LOCS[k]);
  const demo = Object.keys(LOCS).filter(k => !mine.includes(k));
  $('#loc').innerHTML = `<option value="">Choose a location…</option>`
    + (mine.length ? `<optgroup label="Your location">${mine.map(k => `<option value="${k}">${esc(LOCS[k].label)}</option>`).join('')}</optgroup>` : '')
    + `<optgroup label="Demo places in Johar Town">${demo.map(k => `<option value="${k}">${esc(LOCS[k].label)}</option>`).join('')}</optgroup>`;
  $('#loc').value = cur && LOCS[cur] ? cur : '';
}
$('#loc').addEventListener('change', () => resumeIfWaiting());
renderLocOptions();
$('#send').addEventListener('click', () => { const v = $('#text').value; $('#text').value = ''; citizenSays(v, $('#loc').value); });
$('#text').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#send').click(); } });
$('#skip1').addEventListener('click', () => advance(1));
$('#skip7').addEventListener('click', () => advance(7));
$('#mLive').addEventListener('click', () => { userPickedMode = true; setMode('live'); toast('Live AI: agent calls use your Claude usage.'); });
$('#mScript').addEventListener('click', () => { userPickedMode = true; setMode('scripted'); });
$('#reset').addEventListener('click', () => { const m = S.mode; delete LOCS.current; delete LOCS.picked; S && (S.awaitLoc = null); renderLocOptions(''); S = fresh(); S.mode = m; S.mapSel = null; boot(); drawPins(); toast('Demo reset'); });

function boot() {
  msgSeq = 0;
  S.chat = [];
  bot(TXT.welcome.en());
  sys('Try a sample below, or type your own. Share your current location or select the spot on a map.');
  renderClock(); setMode(S.mode); renderConsole(); renderChat();
}
S = fresh(); boot();

(async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      SAMPLE = await window.claude.use('sample');
      if (SAMPLE && !userPickedMode) setMode('live'); else setMode(S.mode);
      if (SAMPLE) $('#mLive').title = 'Agents call Claude on your account';
    }
  } catch (e) { SAMPLE = null; }
})();
</script>
</body>
</html>
